services:
  postgres:
    image: postgres:16-alpine
    container_name: suniou-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_salon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - suniou_backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_salon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  suniou_backend_postgres_data:
